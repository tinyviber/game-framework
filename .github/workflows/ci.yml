name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Asset research hygiene
        run: |
          node asset-research/scripts/check-repo-hygiene.mjs --self-test
          node asset-research/scripts/check-repo-hygiene.mjs

      - name: Asset research CC0 smoke render
        run: node asset-research/scripts/render-cc0-smoke.mjs --verify

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
